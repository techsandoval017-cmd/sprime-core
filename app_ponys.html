
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aprende las Vocales con Ponys</title>
    <style>
        body {
            background-color: #87CEEB; /* Azul cielo */
            font-family: 'Comic Sans MS', cursive, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        h1 {
            color: #FFFFFF;
            text-shadow: 2px 2px 4px #000000;
            font-size: 3em;
        }
        .contenedor-botones {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-top: 30px;
        }
        .btn-vocal {
            font-size: 3em;
            padding: 20px 40px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            color: white;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            transition: transform 0.2s, background-color 0.2s;
        }
        .btn-vocal:hover {
            transform: scale(1.1);
        }
        #btn-a { background-color: #FF6B6B; }
        #btn-e { background-color: #4ECDC4; }
        #btn-i { background-color: #FFD93D; color: #333; }
        #btn-o { background-color: #6A0572; }
        #btn-u { background-color: #FF8C42; }

        .pantalla-resultado {
            margin-top: 50px;
            background: white;
            border-radius: 30px;
            padding: 40px;
            display: inline-block;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            min-width: 300px;
            min-height: 200px;
        }
        
        #emoji-pony {
            font-size: 100px;
            margin: 0;
            animation: saltar 0.5s ease;
        }

        #texto-resultado {
            font-size: 2.5em;
            color: #333;
            margin-top: 20px;
        }

        @keyframes saltar {
            0% { transform: translateY(0); }
            50% { transform: translateY(-30px) rotate(-10deg); }
            100% { transform: translateY(0) rotate(0deg); }
        }
    </style>
</head>
<body>

    <h1>🐎 ¡Aprende con los Ponys! 🐎</h1>
    <p style="font-size: 1.5em; color: white; text-shadow: 1px 1px 2px black;">Toca una vocal para ver a tu pony:</p>

    <div class="contenedor-botones">
        <button class="btn-vocal" id="btn-a" onclick="mostrarPony('A', '🐴', 'A de Alazán')">A</button>
        <button class="btn-vocal" id="btn-e" onclick="mostrarPony('E', '🐎', 'E de Equino')">E</button>
        <button class="btn-vocal" id="btn-i" onclick="mostrarPony('I', '🎠', 'I de Indomable')">I</button>
        <button class="btn-vocal" id="btn-o" onclick="mostrarPony('O', '🥕', 'O de Orejas')">O</button>
        <button class="btn-vocal" id="btn-u" onclick="mostrarPony('U', '🦄', 'U de Unicornio')">U</button>
    </div>

    <div class="pantalla-resultado">
        <div id="emoji-pony">🐴</div>
        <div id="texto-resultado">¡Elige una vocal!</div>
    </div>

    <script>
        function mostrarPony(vocal, emoji, palabra) {
            const elEmoji = document.getElementById('emoji-pony');
            const elTexto = document.getElementById('texto-resultado');
            
            // Reiniciar animación clonando el elemento
            elEmoji.classList.remove('animado');
            void elEmoji.offsetWidth; // trigger reflow
            
            elEmoji.textContent = emoji;
            elTexto.innerHTML = `<strong>${vocal}</strong> - ${palabra}`;
            
            // Aplicar animación manual
            elEmoji.style.animation = 'none';
            setTimeout(() => {
                elEmoji.style.animation = 'saltar 0.5s ease';
            }, 10);
        }
    </script>
</body>
</html>
